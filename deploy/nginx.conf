# nginx örnek yapılandırması — HTTPS sonlandırma ve ters vekil (reverse proxy).
#
# HTTPS sertifikası için: sudo certbot --nginx -d melekguzellik.com

server {
    listen 80;
    server_name melekguzellik.com www.melekguzellik.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name melekguzellik.com www.melekguzellik.com;

    ssl_certificate     /etc/letsencrypt/live/melekguzellik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melekguzellik.com/privkey.pem;

    # Yönetici panelini ikinci bir şifreyle korumak isterseniz:
    # location /admin/ {
    #     auth_basic "Yonetici";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     proxy_pass http://127.0.0.1:3000;
    # }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
