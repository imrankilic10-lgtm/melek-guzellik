<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yönetici Paneli — Melek Güzellik Salonu</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <div class="brand">
        <span class="brand__name">Melek</span>
        <span class="brand__sub">Yönetici Paneli</span>
      </div>
      <a class="phone" href="../index.html">Randevu Sayfası</a>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1 class="intro__title">Randevular</h1>
      <p class="intro__text">Randevular tarih ve saate göre sıralanır.</p>
    </section>

    <section class="stats" aria-label="Özet">
      <div class="stat">
        <span class="stat__label">Bugün</span>
        <span class="stat__value" id="stat-today">0</span>
      </div>
      <div class="stat">
        <span class="stat__label">Yaklaşan</span>
        <span class="stat__value" id="stat-upcoming">0</span>
      </div>
      <div class="stat">
        <span class="stat__label">Toplam Kayıt</span>
        <span class="stat__value" id="stat-all">0</span>
      </div>
      <div class="stat">
        <span class="stat__label">Bugünkü Ciro</span>
        <span class="stat__value" id="stat-revenue">0 TL</span>
      </div>
    </section>

    <div class="admin-filters" id="filters" role="group" aria-label="Randevu filtresi">
      <button type="button" class="filter" data-filter="today" aria-pressed="true">Bugün</button>
      <button type="button" class="filter" data-filter="tomorrow" aria-pressed="false">Yarın</button>
      <button type="button" class="filter" data-filter="upcoming" aria-pressed="false">Yaklaşan</button>
      <button type="button" class="filter" data-filter="all" aria-pressed="false">Tüm Randevular</button>
    </div>

    <p class="notice" id="admin-notice" role="status" hidden></p>

    <section aria-live="polite">
      <h2 class="step__title" id="list-title">Bugünkü Randevular</h2>
      <div id="appointment-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Melek Güzellik Salonu — Yönetici Paneli</p>
      <p><a href="tel:+905551918058">0555 191 8058</a></p>
    </div>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/booking.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
